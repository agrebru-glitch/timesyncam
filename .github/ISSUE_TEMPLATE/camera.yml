name: Поддержка камеры
description: Камера или формат читаются неправильно или не читаются совсем
labels: ["камеры"]
body:
  - type: markdown
    attributes:
      value: |
        Программа знает о камере только то, что записано в её файлах. Пришлите метаданные — и мы научим программу понимать вашу камеру.

        **Перед отправкой** уберите из метаданных серийный номер камеры, координаты GPS и пути к файлам, по которым можно узнать вас или заказчика. Видеофайлы прикладывать не нужно.
  - type: input
    id: camera
    attributes:
      label: Камера и прошивка
      placeholder: "Sony FX30, прошивка 4.01"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Настройки тайм-кода и записи
      placeholder: |
        TC Run: Free Run
        TC Make: Preset
        Формат: XAVC S-I 4K 50p
  - type: textarea
    id: problem
    attributes:
      label: Что не так
      description: Например, клипы встали не по времени, не читается тайм-код или файл не открывается.
    validations:
      required: true
  - type: textarea
    id: ffprobe
    attributes:
      label: Вывод ffprobe
      description: 'Команда: ffprobe -v error -show_format -show_streams -of json "клип.mp4"'
      render: json
    validations:
      required: true
  - type: textarea
    id: sidecar
    attributes:
      label: XML или другой файл рядом с клипом
      description: У Sony — C0001M01.XML. Если такого файла нет, оставьте пустым.
      render: xml
