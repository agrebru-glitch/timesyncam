name: Проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Типы, тесты, сборка (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Часть тестов пишет и читает настоящие файлы (выравнивание звука, сдвиг звука в MP4) — нужен ffmpeg.
      - name: FFmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install ffmpeg -y --no-progress > /dev/null; else brew install ffmpeg > /dev/null; fi
          ffmpeg -version | head -n 1
      - run: npm test
      - run: npm run build
